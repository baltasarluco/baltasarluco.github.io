<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brick Breaker — Baltasar Luco</title>
  <meta name="description" content="A small brick breaker game tucked behind the site's nameplate." />
  <link rel="icon" href="../assets/img/favicon.png" />
  <script>
    /* Match the theme chosen on the main site before first paint. */
    try { var t = localStorage.getItem('theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../assets/css/styles.css?v=20261007a" />
  <style>
    /* The popout borrows the site's tokens from styles.css; only the window
       chrome and the board live here. No palette is redefined. */
    html, body{ height: 100%; }
    body{
      margin: 0;
      min-height: 100dvh;
      display: block;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.5 var(--font-body);
      /* auto, not hidden: in a very short window the board would otherwise be
         clipped with no way to scroll to it. */
      overflow: auto;
    }
    body::after{ content: none; }           /* no page veil in the popout */

    .popout{
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .popout__titlebar{
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      height: 46px; padding: 0 10px 0 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      user-select: none;
      -webkit-backdrop-filter: saturate(140%) blur(10px);
      backdrop-filter: saturate(140%) blur(10px);
    }
    .popout__title{
      font-family: var(--font-display);
      font-weight: 600;
      letter-spacing: -.02em;
      font-size: 17px;
      display: inline-flex; align-items: center; gap: 9px;
    }
    /* The nameplate dot from the site header, reused as the game's mark. */
    .popout__mark{
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(var(--accent-rgb), .16);
      flex: none;
    }
    .popout__actions{ display: flex; align-items: center; gap: 8px; }

    .ctl{
      font: 500 12.5px/1 var(--font-body);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--panel-soft);
      color: var(--fg);
      cursor: pointer;
      transition: background .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease);
    }
    .ctl:hover{ background: rgba(var(--accent-rgb), .10); border-color: var(--accent); color: var(--accent); }
    .ctl--icon{ padding: 8px 10px; }

    .hud{
      display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap;
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--panel-soft);
    }
    .badge{
      display: inline-flex; align-items: baseline; gap: 6px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 11px;
      font-size: 11px;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .badge b{
      font: 500 13px/1 var(--font-mono);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
      color: var(--fg);
    }
    .badge--hint{ text-transform: none; letter-spacing: 0; font-size: 11.5px; }
    .badge--hint kbd{
      font: 500 11px/1 var(--font-mono);
      border: 1px solid var(--border-strong);
      border-radius: 5px;
      padding: 2px 4px;
      color: var(--fg-soft);
    }

    .wrap{ display: grid; place-items: center; padding: 12px; flex: 1; min-height: 0; }
    canvas{
      display: block;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--img-shadow);
      touch-action: none;
      cursor: crosshair;
    }
    canvas:focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; }

    .sr-only{
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    @media (max-width: 420px){
      .popout__title{ font-size: 15px; }
      .badge--hint{ display: none; }
    }
  </style>
</head>
<body>
  <div class="popout">
    <div class="popout__titlebar">
      <div class="popout__title"><span class="popout__mark" aria-hidden="true"></span>Brick Breaker</div>
      <div class="popout__actions">
        <button id="btnReset" class="ctl" type="button">Reset</button>
        <button id="btnClose" class="ctl ctl--icon" type="button" aria-label="Close this window">✕</button>
      </div>
    </div>

    <div class="hud">
      <span class="badge">Score <b id="score">0</b></span>
      <span class="badge">Level <b id="level">1</b></span>
      <span class="badge badge--hint">Move with the mouse or <kbd>←</kbd> <kbd>→</kbd></span>
    </div>

    <div class="wrap">
      <canvas id="game" tabindex="0" role="application"
              aria-label="Brick breaker board. Move the paddle with the mouse or the left and right arrow keys. Press space to launch the ball."></canvas>
    </div>

    <p class="sr-only" id="liveStatus" role="status" aria-live="polite"></p>
  </div>

  <script>
  (function(){
    const canvas   = document.getElementById('game');
    const ctx      = canvas.getContext('2d');
    const scoreEl  = document.getElementById('score');
    const levelEl  = document.getElementById('level');
    const liveEl   = document.getElementById('liveStatus');
    const btnReset = document.getElementById('btnReset');
    const btnClose = document.getElementById('btnClose');

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    // --- Board geometry (logical pixels; the canvas backing store is scaled by DPR) ---
    const PADDLE_W = 80, PADDLE_H = 12, PADDLE_Y_OFFSET = 18;
    const BALL_R = 6;
    const ROWS_START = 4, COLS = 8, ROWS_MAX = 10;
    const BRICK_H = 18, BRICK_GUTTER = 5, BRICK_TOP = 40, BRICK_SIDE = 20;

    // Physics is expressed in units per 1/60 s and integrated against real time,
    // so the ball travels at the same speed on 60 Hz and 120 Hz displays.
    const FRAME = 1000 / 60;
    const MAX_DT = 3;              // clamp after a tab switch so nothing teleports
    const LAUNCH_SPEED = 5.0;
    const MAX_SPEED = 9.0;         // keeps the ball from outrunning the paddle
    const SPEEDUP = 1.01;
    const KEY_PADDLE_SPEED = 7.5;  // logical px per 1/60 s

    let W = 440, H = 440;          // logical board size
    let paddleX, ballX, ballY, ballVX, ballVY;
    let rows = ROWS_START, level = 1, score = 0;
    let running = false, gameOver = false;
    let bricks = [];
    let overlayMsg = '';
    let trail = [];                // the long exposure: recent ball positions
    let keyLeft = false, keyRight = false;
    let lastTs = 0, rafId = 0;

    // --- Theme: every canvas colour comes from the stylesheet, so the board
    //     follows the site's dark/light choice instead of hard-coding one. ---
    const theme = {};
    function cssVar(name, fallback){
      const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      return v || fallback;
    }
    function toRGB(value, fallback){
      const v = (value || '').trim();
      let m = v.match(/^#([0-9a-f]{3})$/i);
      if (m) return [0,1,2].map(i => parseInt(m[1][i] + m[1][i], 16));
      m = v.match(/^#([0-9a-f]{6})$/i);
      if (m) return [0,2,4].map(i => parseInt(m[1].slice(i, i+2), 16));
      m = v.match(/^rgba?\(([^)]+)\)$/i);
      if (m) return m[1].split(',').slice(0,3).map(n => parseFloat(n));
      m = v.match(/^(\d+)\s*,\s*(\d+)\s*,\s*(\d+)$/);
      if (m) return [+m[1], +m[2], +m[3]];
      return fallback;
    }
    function rgba(rgb, a){ return `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`; }
    function mix(a, b, t){ return a.map((v, i) => Math.round(v + (b[i] - v) * t)); }

    function readTheme(){
      theme.bg      = toRGB(cssVar('--bg', '#0a1118'), [10,17,24]);
      theme.panel   = toRGB(cssVar('--panel-solid', '#111c26'), [17,28,38]);
      theme.accent  = toRGB(cssVar('--accent', '#3cf5d0'), [60,245,208]);
      theme.warm    = toRGB(cssVar('--warm', '#dcb77c'), [220,183,124]);
      theme.fg      = toRGB(cssVar('--fg', '#e9eef2'), [233,238,242]);
      theme.muted   = toRGB(cssVar('--muted', '#8fa0ad'), [143,160,173]);
      theme.border  = toRGB(cssVar('--border-strong', '#2a3a46'), [42,58,70]);
      theme.isLight = (theme.bg[0] + theme.bg[1] + theme.bg[2]) / 3 > 128;
    }
    readTheme();

    new MutationObserver(() => { readTheme(); draw(); })
      .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    window.matchMedia('(prefers-color-scheme: light)')
      .addEventListener('change', () => { readTheme(); draw(); });

    // --- Helpers ---
    function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
    function brickWidth(){ return (W - BRICK_SIDE * 2) / COLS; }
    function paddleTop(){ return H - PADDLE_Y_OFFSET - PADDLE_H; }

    function applyDefaults(){
      paddleX = (W - PADDLE_W) / 2;
      ballX = W / 2;
      ballY = paddleTop() - BALL_R - 2;
      ballVX = 0; ballVY = 0;
      trail = [];
    }

    function createBricks(){
      bricks = [];
      const BW = brickWidth();
      for (let r = 0; r < rows; r++){
        const row = [];
        for (let c = 0; c < COLS; c++){
          row.push({ x: BRICK_SIDE + c * BW, y: BRICK_TOP + r * (BRICK_H + BRICK_GUTTER), row: r, hits: 1 });
        }
        bricks.push(row);
      }
    }

    function setOverlay(msg){ overlayMsg = msg || ''; }
    function announce(msg){ if (liveEl) liveEl.textContent = msg; }

    function updateHUD(){
      scoreEl.textContent = score;
      levelEl.textContent = level;
    }

    // --- Canvas sizing: one resize path, DPR-aware, never mid-rally ---
    function boardSize(){
      const PAD_X = 26, PAD_Y = 124;
      const MIN = 300, MAX = 450;
      const availW = Math.max(0, window.innerWidth  - PAD_X);
      const availH = Math.max(0, window.innerHeight - PAD_Y);
      return Math.max(MIN, Math.min(MAX, Math.floor(Math.min(availW, availH))));
    }
    function fitCanvas(){
      const size = boardSize();
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      W = H = size;
      canvas.style.width = size + 'px';
      canvas.style.height = size + 'px';
      canvas.width  = Math.round(size * dpr);
      canvas.height = Math.round(size * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function relayout(){
      // Rebuilding the board mid-rally would move bricks under the ball, so a
      // resize while playing only rescales what is already on screen.
      const wasRunning = running;
      const prevW = W;
      fitCanvas();
      if (wasRunning && prevW > 0){
        const k = W / prevW;
        paddleX = clamp(paddleX * k, 0, W - PADDLE_W);
        ballX *= k; ballY *= k;
        trail = [];
        const BW = brickWidth();
        bricks.forEach((row, r) => row.forEach((b, c) => {
          if (b){ b.x = BRICK_SIDE + c * BW; b.y = BRICK_TOP + r * (BRICK_H + BRICK_GUTTER); }
        }));
      } else {
        createBricks();
        applyDefaults();
      }
      draw();
    }
    window.addEventListener('resize', relayout);

    // --- Input ---
    function pointerToBoardX(evt){
      const rect = canvas.getBoundingClientRect();
      const clientX = evt.touches && evt.touches.length ? evt.touches[0].clientX : evt.clientX;
      return (clientX - rect.left) * (W / rect.width);
    }
    function onPointerMove(evt){
      if (!running || gameOver) return;      // the board stays put until play starts
      paddleX = clamp(pointerToBoardX(evt) - PADDLE_W / 2, 0, W - PADDLE_W);
      evt.preventDefault();
    }
    canvas.addEventListener('mousemove', onPointerMove);
    canvas.addEventListener('touchmove', onPointerMove, { passive: false });

    function startIfPossible(){
      if (gameOver){ resetGame(); }
      if (running) return;                   // no pause; a click only ever starts
      setOverlay('');
      launchBall();
      running = true;
      announce('Ball launched.');
      startLoop();
    }
    // Clicking a tabindex'd canvas focuses it natively; calling focus() here as
    // well would also raise the keyboard focus ring on a plain mouse click.
    canvas.addEventListener('mousedown', startIfPossible);
    canvas.addEventListener('touchstart', (e) => { startIfPossible(); e.preventDefault(); }, { passive: false });

    canvas.addEventListener('keydown', (e) => {
      switch (e.key){
        case 'ArrowLeft': case 'a': case 'A': keyLeft = true; e.preventDefault(); break;
        case 'ArrowRight': case 'd': case 'D': keyRight = true; e.preventDefault(); break;
        case ' ': case 'Enter': startIfPossible(); e.preventDefault(); break;
        case 'r': case 'R': resetGame(); announce('Game reset.'); e.preventDefault(); break;
      }
      if (!running) startLoop();              // keyboard aiming works while idle too
    });
    canvas.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') keyLeft = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keyRight = false;
    });
    window.addEventListener('blur', () => { keyLeft = keyRight = false; });

    btnReset.addEventListener('click', () => { resetGame(); announce('Game reset.'); canvas.focus(); });
    btnClose.addEventListener('click', () => {
      window.close();
      // window.close() is ignored unless a script opened this window.
      setTimeout(() => { if (!window.closed) window.location.href = '../index.html'; }, 120);
    });

    function resetGame(){
      score = 0; level = 1; rows = ROWS_START; gameOver = false; running = false;
      createBricks();
      applyDefaults();
      updateHUD();
      setOverlay('Click or press space to start');
      draw();
    }

    function launchBall(){
      // Up and out at a random angle, never close to vertical.
      const deg = (Math.random() * 120 - 60) * Math.PI / 180;
      let vx = LAUNCH_SPEED * Math.sin(deg);
      let vy = -Math.abs(LAUNCH_SPEED * Math.cos(deg));
      const MIN_VX = 1.0;
      if (Math.abs(vx) < MIN_VX){
        vx = MIN_VX * (Math.random() < 0.5 ? -1 : 1);
        vy = -Math.sqrt(Math.max(0.1, LAUNCH_SPEED * LAUNCH_SPEED - vx * vx));
      }
      ballVX = vx; ballVY = vy;
      trail = [];
    }

    // --- Simulation ---
    function movePaddleByKeys(dt){
      if (!keyLeft && !keyRight) return;
      const delta = (keyRight ? 1 : 0) - (keyLeft ? 1 : 0);
      paddleX = clamp(paddleX + delta * KEY_PADDLE_SPEED * dt, 0, W - PADDLE_W);
      if (!running && !gameOver){ ballX = clamp(paddleX + PADDLE_W / 2, BALL_R, W - BALL_R); }
    }

    function bounceOffPaddle(){
      const top = paddleTop();
      if (ballVY <= 0) return false;
      if (ballY + BALL_R < top || ballY - BALL_R > top + PADDLE_H) return false;
      if (ballX < paddleX - BALL_R || ballX > paddleX + PADDLE_W + BALL_R) return false;

      ballY = top - BALL_R;
      const hitPos = clamp((ballX - (paddleX + PADDLE_W / 2)) / (PADDLE_W / 2), -1, 1);
      const angle = hitPos * (Math.PI / 3);                        // up to 60°
      const speed = Math.min(Math.hypot(ballVX, ballVY) * SPEEDUP, MAX_SPEED);
      ballVX = speed * Math.sin(angle);
      ballVY = -Math.abs(speed * Math.cos(angle));
      return true;
    }

    function hitBricks(){
      const BW = brickWidth();
      const bw = BW - BRICK_GUTTER;
      for (let r = 0; r < bricks.length; r++){
        for (let c = 0; c < bricks[r].length; c++){
          const b = bricks[r][c];
          if (!b || b.hits <= 0) continue;
          const cx = clamp(ballX, b.x, b.x + bw);
          const cy = clamp(ballY, b.y, b.y + BRICK_H);
          const dx = ballX - cx, dy = ballY - cy;
          if (dx * dx + dy * dy <= BALL_R * BALL_R){
            b.hits -= 1; score += 10; updateHUD();
            if (Math.abs(dx) > Math.abs(dy)) ballVX *= -1; else ballVY *= -1;
            if (b.hits <= 0) bricks[r][c] = null;
            return true;
          }
        }
      }
      return false;
    }

    function substep(dt){
      ballX += ballVX * dt;
      ballY += ballVY * dt;

      if (ballX < BALL_R){ ballX = BALL_R; ballVX = Math.abs(ballVX); }
      if (ballX > W - BALL_R){ ballX = W - BALL_R; ballVX = -Math.abs(ballVX); }
      if (ballY < BALL_R){ ballY = BALL_R; ballVY = Math.abs(ballVY); }

      bounceOffPaddle();
      hitBricks();

      if (ballY > H + BALL_R){
        running = false; gameOver = true;
        applyDefaults();
        setOverlay('Game over — click to start again');
        announce('Game over. Final score ' + score + '.');
        return false;
      }

      if (!bricks.some(row => row.some(b => b && b.hits > 0))){
        level += 1;
        rows = Math.min(rows + 1, ROWS_MAX);
        createBricks();
        applyDefaults();
        updateHUD();
        running = false;
        setOverlay('Level ' + level + ' — click to start');
        announce('Level ' + level + ' ready. Score ' + score + '.');
        return false;
      }
      return true;
    }

    function step(dt){
      movePaddleByKeys(dt);
      if (!running || gameOver) return;

      // Split the frame so a fast ball can never tunnel through the paddle or a brick.
      const travel = Math.hypot(ballVX, ballVY) * dt;
      const steps = Math.max(1, Math.ceil(travel / (BALL_R * 0.8)));
      const sub = dt / steps;
      for (let i = 0; i < steps; i++){ if (!substep(sub)) break; }

      if (!reduceMotion.matches && running){
        trail.push({ x: ballX, y: ballY });
        if (trail.length > 14) trail.shift();
      }
    }

    // --- Rendering ---
    function drawBackground(){
      const g = ctx.createRadialGradient(W * .7, H * .28, 10, W * .7, H * .28, W * .95);
      g.addColorStop(0, rgba(mix(theme.panel, theme.accent, theme.isLight ? .05 : .07), 1));
      g.addColorStop(1, rgba(theme.bg, 1));
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    function roundRect(x, y, w, h, r){
      const rr = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.arcTo(x + w, y, x + w, y + h, rr);
      ctx.arcTo(x + w, y + h, x, y + h, rr);
      ctx.arcTo(x, y + h, x, y, rr);
      ctx.arcTo(x, y, x + w, y, rr);
      ctx.closePath();
    }

    function drawBricks(){
      const bw = brickWidth() - BRICK_GUTTER;
      const span = Math.max(1, rows - 1);
      for (const row of bricks){
        for (const b of row){
          if (!b || b.hits <= 0) continue;
          // Rows cool from accent to warm with depth — the star-trail gradient.
          const t = b.row / span;
          const hue = mix(theme.accent, theme.warm, t);
          ctx.fillStyle = rgba(mix(theme.panel, hue, theme.isLight ? .18 : .13), 1);
          roundRect(b.x, b.y, bw, BRICK_H, 4);
          ctx.fill();
          ctx.fillStyle = rgba(hue, theme.isLight ? .85 : .7);
          roundRect(b.x, b.y, bw, 2.5, 1.25);
          ctx.fill();
        }
      }
    }

    function drawTrail(){
      if (!trail.length) return;
      for (let i = 0; i < trail.length; i++){
        const p = trail[i];
        const t = (i + 1) / trail.length;
        ctx.beginPath();
        ctx.arc(p.x, p.y, BALL_R * (0.35 + 0.55 * t), 0, Math.PI * 2);
        // The light ground swallows a faint trail, so it carries more weight there.
        const base = theme.isLight ? 0.10 : 0.05;
        const span = theme.isLight ? 0.34 : 0.16;
        ctx.fillStyle = rgba(theme.warm, base + span * t);
        ctx.fill();
      }
    }

    function drawBall(){
      ctx.beginPath();
      ctx.arc(ballX, ballY, BALL_R, 0, Math.PI * 2);
      ctx.fillStyle = rgba(theme.warm, 1);
      ctx.fill();
    }

    function drawPaddle(){
      ctx.fillStyle = rgba(theme.accent, 1);
      roundRect(paddleX, paddleTop(), PADDLE_W, PADDLE_H, 6);
      ctx.fill();
    }

    function drawOverlay(){
      if (!overlayMsg) return;
      ctx.fillStyle = rgba(theme.bg, theme.isLight ? .72 : .66);
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = rgba(theme.fg, 1);
      ctx.font = '600 19px "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif';
      ctx.fillText(overlayMsg, W / 2, H / 2 - 4);
      ctx.fillStyle = rgba(theme.muted, 1);
      ctx.font = '400 12px "Instrument Sans", system-ui, sans-serif';
      ctx.fillText('Arrow keys move the paddle', W / 2, H / 2 + 20);
    }

    function draw(){
      ctx.clearRect(0, 0, W, H);
      drawBackground();
      drawBricks();
      drawTrail();
      drawPaddle();
      drawBall();
      drawOverlay();
    }

    // --- Loop: runs while there is something to animate, then sleeps ---
    function frame(ts){
      rafId = 0;
      const dt = lastTs ? clamp((ts - lastTs) / FRAME, 0, MAX_DT) : 1;
      lastTs = ts;
      step(dt);
      draw();
      if (running || keyLeft || keyRight) startLoop();
      else lastTs = 0;
    }
    function startLoop(){
      if (rafId || document.hidden) return;
      rafId = requestAnimationFrame(frame);
    }
    document.addEventListener('visibilitychange', () => {
      if (document.hidden){
        if (rafId){ cancelAnimationFrame(rafId); rafId = 0; }
        lastTs = 0;
      } else if (running){
        startLoop();
      }
    });

    // --- Boot ---
    fitCanvas();
    resetGame();
    updateHUD();
  })();
  </script>
</body>
</html>
