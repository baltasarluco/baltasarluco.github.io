<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Column information — Spectra Viewer</title>
  <link rel="icon" href="../assets/img/favicon.png" />
  <script>
    /* Match the theme chosen on the main site before first paint. */
    try { var t = localStorage.getItem('theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
  <style>
    /* Same tokens and theme mechanism as the viewer it opens from. */
    :root{
      --font-display: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
      --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color-scheme: dark;
      --bg: #0a1118;
      --fg: #e9eef2;
      --fg-soft: #c3ced6;
      --muted: #8fa0ad;
      --accent: #3cf5d0;
      --accent-rgb: 60,245,208;
      --accent-ink: #032b22;
      --panel: #101a24;
      --panel-solid: #111c26;
      --panel-soft: #16222e;
      --border: rgba(255,255,255,.09);
      --border-strong: rgba(255,255,255,.18);
    }
    @media (prefers-color-scheme: light){
      :root:not([data-theme="dark"]){
        color-scheme: light;
        --bg: #f2f5f7;
        --fg: #0f1a22;
        --fg-soft: #2b3a46;
        --muted: #5d6f7c;
        --accent: #0a8f74;
        --accent-rgb: 10,143,116;
        --accent-ink: #ffffff;
        --panel: #ffffff;
        --panel-solid: #ffffff;
        --panel-soft: #eef2f5;
        --border: rgba(15,26,34,.12);
        --border-strong: rgba(15,26,34,.24);
      }
    }
    :root[data-theme="light"]{
      color-scheme: light;
      --bg: #f2f5f7;
      --fg: #0f1a22;
      --fg-soft: #2b3a46;
      --muted: #5d6f7c;
      --accent: #0a8f74;
      --accent-rgb: 10,143,116;
      --accent-ink: #ffffff;
      --panel: #ffffff;
      --panel-solid: #ffffff;
      --panel-soft: #eef2f5;
      --border: rgba(15,26,34,.12);
      --border-strong: rgba(15,26,34,.24);
    }

    *{ box-sizing: border-box; }
    body{
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--fg);
      margin: 0;
      padding: 24px 20px 40px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .container{ max-width: 1200px; margin: 0 auto; }

    .page-head{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    h1, h2{
      font-family: var(--font-display);
      text-wrap: balance;
      font-size: clamp(22px, 3vw, 28px);
      font-weight: 600;
      letter-spacing: -.024em;
      line-height: 1.05;
      margin: 0;
      color: var(--fg);
    }

    button{
      font: 600 13px var(--font-body);
      padding: 9px 16px;
      border: 1px solid var(--accent);
      border-radius: 10px;
      background: var(--accent);
      color: var(--accent-ink);
      cursor: pointer;
      transition: filter .2s ease;
    }
    button:hover{ filter: brightness(1.08); }
    button:focus-visible, input:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

    .filter-box{ margin-bottom: 24px; }
    input{
      font: 400 14px var(--font-body);
      padding: 10px 14px;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      width: 100%;
      max-width: 400px;
      background: var(--panel-solid);
      color: var(--fg);
      transition: border-color .2s ease;
    }
    input::placeholder{ color: var(--muted); }
    input:focus{ border-color: var(--accent); }

    .spectrum-card{
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 24px;
      margin-bottom: 18px;
    }
    .spectrum-name{
      font-family: var(--font-display);
      font-size: 18px;
      margin: 0 0 10px;
      font-weight: 600;
      letter-spacing: -.02em;
      margin-bottom: 10px;
      color: var(--fg);
    }
    .column-count{
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .09em;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .columns{ display: flex; flex-wrap: wrap; gap: 8px; }
    .column-tag{
      background: var(--panel-soft);
      border: 1px solid var(--border);
      padding: 5px 11px;
      border-radius: 7px;
      font-size: 12.5px;
      color: var(--fg-soft);
      font-family: var(--font-mono);
    }
    .no-data{
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 15px;
    }
    .info-box{
      background: rgba(var(--accent-rgb), .08);
      border: 1px solid rgba(var(--accent-rgb), .35);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 24px;
      font-size: 13.5px;
      color: var(--fg-soft);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-head">
      <h1>Available columns by spectrum</h1>
      <button type="button" onclick="refreshData()">↻ Refresh</button>
    </div>
    <div class="info-box" id="infoBox" role="status" aria-live="polite">
      Loading column information from the viewer…
    </div>
    <div class="filter-box">
      <input type="text" id="filterInput" placeholder="Filter by spectrum name…" autocomplete="off" spellcheck="false" aria-label="Filter by spectrum name" oninput="filterSpectra()">
    </div>
    <div id="spectraList" style="display: none;">
      <!-- Content will be populated by JavaScript -->
    </div>
  </div>
  
  <script>
    let spectraData = {};
    
    // Listen for data from parent window
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'spectraData') {
        spectraData = event.data.data;
        
        // Hide loading message
        const infoBox = document.getElementById('infoBox');
        if (infoBox) infoBox.style.display = 'none';
        
        // Display the data
        displaySpectra();
      }
    });
    
    // Request data from parent on page load/refresh
    window.addEventListener('DOMContentLoaded', () => {
      if (window.opener) {
        window.opener.postMessage({ type: 'requestSpectraData' }, '*');
      } else {
        // No parent window, show error
        const infoBox = document.getElementById('infoBox');
        const listEl = document.getElementById('spectraList');
        if (infoBox) {
          infoBox.textContent = 'Error: This page must be opened from the Spectral Viewer.';
        }
        if (listEl) {
          listEl.style.display = 'block';
          listEl.innerHTML = '<div class="no-data">No column information available. Please load spectra in the main viewer.</div>';
        }
      }
    });
    
    // Function to refresh data from parent
    function refreshData() {
      
      // Show loading message
      const infoBox = document.getElementById('infoBox');
      const listEl = document.getElementById('spectraList');
      if (infoBox) {
        infoBox.textContent = 'Refreshing data…';
        infoBox.style.display = 'block';
      }
      if (listEl) {
        listEl.style.display = 'none';
      }
      
      if (window.opener) {
        window.opener.postMessage({ type: 'requestSpectraData' }, '*');
      } else {
        if (infoBox) {
          infoBox.textContent = 'Error: Could not connect to parent window.';
        }
        alert('Could not connect to parent window. Please ensure the main viewer is still open.');
      }
    }
    
    function displaySpectra() {
      const listEl = document.getElementById('spectraList');
      const infoBox = document.getElementById('infoBox');
      
      if (!listEl) {
        console.error('spectraList element not found');
        return;
      }
      
      // Hide loading message
      if (infoBox) infoBox.style.display = 'none';
      
      // Show the list container
      listEl.style.display = 'block';
      
      if (!spectraData || typeof spectraData !== 'object') {
        console.error('Invalid spectra data:', spectraData);
        listEl.innerHTML = '<div class="no-data">No column information available. Please load spectra in the main viewer.</div>';
        return;
      }
      
      const names = Object.keys(spectraData);
      
      if (names.length === 0) {
        listEl.innerHTML = '<div class="no-data">No column information available. Please load spectra in the main viewer.</div>';
        return;
      }
      
      let html = '';
      let validCount = 0;
      
      names.forEach(name => {
        const spectrum = spectraData[name];
        
        if (!spectrum) {
          console.warn(`Spectrum ${name} is null or undefined`);
          return;
        }
        
        if (!spectrum.columns || spectrum.columns.length === 0) {
          console.warn(`Spectrum ${name} has no columns`);
          return;
        }
        
        validCount++;
        html += `
          <div class="spectrum-card" data-name="${name.toLowerCase()}">
            <h2 class="spectrum-name">${escapeHtml(name)}</h2>
            <div class="column-count">${spectrum.columns.length} column${spectrum.columns.length !== 1 ? 's' : ''}</div>
            <div class="columns">`;
        
        spectrum.columns.forEach(col => {
          html += `<span class="column-tag">${escapeHtml(col)}</span>`;
        });
        
        html += `
            </div>
          </div>`;
      });
      
      if (validCount === 0) {
        listEl.innerHTML = '<div class="no-data">No column information available. Please load spectra in the main viewer.</div>';
      } else {
        listEl.innerHTML = html;
      }
    }
    
    function filterSpectra() {
      const filter = document.getElementById('filterInput').value.toLowerCase();
      const cards = document.querySelectorAll('.spectrum-card');
      let visibleCount = 0;
      
      cards.forEach(card => {
        const name = card.dataset.name;
        if (name.includes(filter)) {
          card.style.display = 'block';
          visibleCount++;
        } else {
          card.style.display = 'none';
        }
      });
      
      // Show message if no results
      if (visibleCount === 0 && cards.length > 0) {
        const listEl = document.getElementById('spectraList');
        const existing = listEl.querySelector('.no-data');
        if (!existing) {
          const noMatch = document.createElement('div');
          noMatch.className = 'no-data';
          noMatch.textContent = 'No spectra match your filter.';
          listEl.appendChild(noMatch);
        }
      } else {
        const noMatch = document.querySelector('#spectraList .no-data');
        if (noMatch) noMatch.remove();
      }
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
